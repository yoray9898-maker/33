<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>RPG：大冒險 - 技能與裝備系統</title>
    <style>
        body { background: #1a1a1a; color: white; display: flex; flex-direction: column; align-items: center; font-family: "Microsoft JhengHei", sans-serif; margin: 0; }
        #game-container { position: relative; width: 600px; height: 400px; margin-top: 10px; }
        canvas { border: 4px solid #333; background: #000; display: block; }
        
        /* UI 介面 */
        #ui { width: 580px; background: #222; padding: 10px; margin-top: 5px; border-radius: 8px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .stats-panel { border-right: 1px solid #444; padding-right: 10px; }
        .inventory-panel { padding-left: 5px; }
        .item-slot { font-size: 12px; color: #f1c40f; margin: 2px 0; }

        /* 戰鬥畫面 */
        #battle-screen { 
            display: none; position: absolute; top: 0; left: 0; width: 600px; height: 400px; 
            background: rgba(0,0,0,0.95); flex-direction: column; justify-content: space-around; align-items: center; z-index: 100;
        }
        .hp-bar { width: 200px; height: 12px; background: #400; border: 1px solid #fff; margin-top: 5px; }
        .hp-fill { height: 100%; background: #2ecc71; transition: width 0.3s; width: 100%; }
        #battle-log { height: 60px; font-size: 14px; color: #ddd; text-align: center; padding: 0 20px; overflow-y: hidden; }
        .btn { padding: 8px 15px; background: #333; color: white; border: 1px solid #fff; cursor: pointer; margin: 2px; font-size: 13px; }
        .btn:hover { background: #555; }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas" width="600" height="400"></canvas>
        <div id="battle-screen">
            <h2 id="battle-title" style="color: #e74c3c;">遭遇敵襲</h2>
            <div style="display: flex; width: 100%; justify-content: space-around;">
                <div style="text-align:center">
                    <div>勇者</div>
                    <div class="hp-bar"><div id="p-hp-fill" class="hp-fill"></div></div>
                    <div id="p-hp-text" style="font-size:12px"></div>
                </div>
                <div style="text-align:center">
                    <div id="enemy-name">怪物</div>
                    <div class="hp-bar"><div id="e-hp-fill" class="hp-fill"></div></div>
                    <div id="e-hp-text" style="font-size:12px"></div>
                </div>
            </div>
            <div id="battle-log"></div>
            <div>
                <button class="btn" onclick="playerAttack()">攻擊</button>
                <button class="btn" onclick="playerHeal()">藥水(<span id="pot-count">0</span>)</button>
            </div>
        </div>
    </div>

    <div id="ui">
        <div class="stats-panel">
            <div style="color:#0fccff">等級: <span id="lvl">1</span> (<span id="exp">0</span>/100 EXP)</div>
            <div>攻擊: <span id="atk-val">15</span> | 防禦: <span id="def-val">5</span></div>
            <div id="location-text" style="font-size:12px; color:#888">區域：探索中</div>
        </div>
        <div class="inventory-panel">
            <div style="font-weight:bold; color:#f1c40f">裝備欄：</div>
            <div class="item-slot">武器：<span id="eq-weapon">生鏽的劍 (+0)</span></div>
            <div class="item-slot">防具：<span id="eq-armor">破舊的布衣 (+0)</span></div>
        </div>
    </div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
const TILE_SIZE = 40;
const MAP_SIZE = 20;
let map = [];

// --- 數據庫 ---
const monsters = {
    "slime": { name: "史萊姆", hp: 40, atk: 8, def: 2, color: "#9b59b6", exp: 20, skill: { name: "分裂重組", msg: "史萊姆恢復了生命！", effect: (e) => e.hp = Math.min(e.maxHp, e.hp + 15) } },
    "goblin": { name: "哥布林", hp: 60, atk: 15, def: 5, color: "#2ecc71", exp: 40, skill: { name: "連環刺擊", msg: "哥布林發動連擊！", effect: (p) => p.hp -= 10 } },
    "orc": { name: "獸人", hp: 120, atk: 25, def: 10, color: "#e67e22", exp: 80, skill: { name: "狂暴一擊", msg: "獸人力量大增！", effect: (p) => p.hp -= 20 } }
};

const drops = [
    { name: "鋼鐵長劍", type: "weapon", power: 10, chance: 0.2 },
    { name: "騎士板甲", type: "armor", power: 8, chance: 0.15 },
    { name: "龍之怒火", type: "weapon", power: 25, chance: 0.05 },
    { name: "治癒藥水", type: "item", chance: 0.5 }
];

// --- 玩家與狀態 ---
const player = {
    tx: 10, ty: 10, hp: 100, maxHp: 100, level: 1, exp: 0, 
    baseAtk: 15, baseDef: 5,
    potions: 3,
    weapon: { name: "木棒", power: 2 },
    armor: { name: "布衣", power: 1 }
};

let enemy = null;
let inBattle = false;

// --- 核心邏輯 ---
function generateMap() {
    map = [];
    for (let y = 0; y < MAP_SIZE; y++) {
        map[y] = [];
        for (let x = 0; x < MAP_SIZE; x++) {
            if (x === 0 || y === 0 || x === MAP_SIZE-1 || y === MAP_SIZE-1) {
                map[y][x] = (Math.abs(x-10)<=1 || Math.abs(y-10)<=1) ? 0 : 1;
            } else {
                let r = Math.random();
                if (r < 0.1) map[y][x] = 1;
                else if (r < 0.15) map[y][x] = Object.keys(monsters)[Math.floor(Math.random()*3)];
                else map[y][x] = 0;
            }
        }
    }
}

function startBattle(x, y, type) {
    inBattle = true;
    let m = monsters[type];
    enemy = { ...m, maxHp: m.hp + (player.level*10), hp: m.hp + (player.level*10), pos: {x, y} };
    
    document.getElementById("battle-screen").style.display = "flex";
    document.getElementById("enemy-name").innerText = enemy.name;
    document.getElementById("battle-log").innerText = `遭遇 ${enemy.name}！`;
    updateUI();
}

function playerAttack() {
    let atkPower = player.baseAtk + player.weapon.power;
    let dmg = Math.max(5, atkPower - enemy.def + Math.floor(Math.random()*5));
    enemy.hp -= dmg;
    log(`你攻擊 ${enemy.name}，造成 ${dmg} 傷害。`);
    
    if (enemy.hp <= 0) return winBattle();
    setTimeout(enemyTurn, 600);
}

function enemyTurn() {
    if (enemy.hp <= 0) return;
    
    // 怪物技能觸發 (25% 機率)
    if (Math.random() < 0.25) {
        log(`<span style="color:yellow">技能：${enemy.skill.name}！${enemy.skill.msg}</span>`);
        enemy.skill.effect(enemy.skill.name === "分裂重組" ? enemy : player);
    } else {
        let defPower = player.baseDef + player.armor.power;
        let dmg = Math.max(3, enemy.atk - defPower + Math.floor(Math.random()*5));
        player.hp -= dmg;
        log(`${enemy.name} 攻擊，造成 ${dmg} 傷害。`);
    }
    
    updateUI();
    if (player.hp <= 0) { alert("你冒險失敗了..."); location.reload(); }
}

function winBattle() {
    log(`<span style="color:#0f0">勝利！獲得 ${enemy.exp} 經驗。</span>`);
    player.exp += enemy.exp;
    map[enemy.pos.y][enemy.pos.x] = 0;
    
    // 掉落檢查
    drops.forEach(item => {
        if (Math.random() < item.chance) {
            if (item.type === "item") {
                player.potions++;
                log(`獲得了 [${item.name}]！`);
            } else {
                let currentPower = item.type === "weapon" ? player.weapon.power : player.armor.power;
                if (item.power > currentPower) {
                    if (item.type === "weapon") player.weapon = item;
                    else player.armor = item;
                    log(`<span style="color:cyan">拾獲並裝備了 [${item.name}]！</span>`);
                }
            }
        }
    });

    if (player.exp >= 100) {
        player.level++; player.exp = 0;
        player.baseAtk += 5; player.baseDef += 3;
        player.maxHp += 20; player.hp = player.maxHp;
        log("等級提升！能力大幅增強！");
    }

    setTimeout(() => { document.getElementById("battle-screen").style.display="none"; inBattle=false; }, 1200);
}

function playerHeal() {
    if (player.potions > 0) {
        player.potions--;
        player.hp = Math.min(player.maxHp, player.hp + 40);
        log("喝下藥水，生命恢復 40 點。");
        updateUI();
        setTimeout(enemyTurn, 600);
    }
}

// --- 輔助功能 ---
function log(msg) { document.getElementById("battle-log").innerHTML = msg; }

function updateUI() {
    document.getElementById("p-hp-fill").style.width = (player.hp / player.maxHp * 100) + "%";
    document.getElementById("e-hp-fill").style.width = (enemy ? (enemy.hp / enemy.maxHp * 100) : 0) + "%";
    document.getElementById("p-hp-text").innerText = `${player.hp}/${player.maxHp}`;
    document.getElementById("e-hp-text").innerText = enemy ? `${enemy.hp}/${enemy.maxHp}` : "";
    document.getElementById("lvl").innerText = player.level;
    document.getElementById("exp").innerText = player.exp;
    document.getElementById("atk-val").innerText = player.baseAtk + player.weapon.power;
    document.getElementById("def-val").innerText = player.baseDef + player.armor.power;
    document.getElementById("pot-count").innerText = player.potions;
    document.getElementById("eq-weapon").innerText = `${player.weapon.name} (+${player.weapon.power})`;
    document.getElementById("eq-armor").innerText = `${player.armor.name} (+${player.armor.power})`;
}

// --- 繪圖與移動 ---
function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const offsetX = 300 - (player.tx * 40 + 20);
    const offsetY = 200 - (player.ty * 40 + 20);
    ctx.save();
    ctx.translate(offsetX, offsetY);

    for (let y = 0; y < MAP_SIZE; y++) {
        for (let x = 0; x < MAP_SIZE; x++) {
            let t = map[y][x];
            ctx.fillStyle = (t === 1) ? "#444" : (t === 0) ? "#222" : monsters[t].color;
            ctx.fillRect(x*40, y*40, 38, 38);
        }
    }
    ctx.fillStyle = "#00ffcc";
    ctx.fillRect(player.tx*40+5, player.ty*40+5, 30, 30);
    ctx.restore();
    requestAnimationFrame(draw);
}

window.addEventListener("keydown", e => {
    if (inBattle) return;
    let nx = player.tx, ny = player.ty;
    if (e.key === "ArrowUp") ny--;
    if (e.key === "ArrowDown") ny++;
    if (e.key === "ArrowLeft") nx--;
    if (e.key === "ArrowRight") nx++;

    if (nx < 0 || nx >= MAP_SIZE || ny < 0 || ny >= MAP_SIZE) {
        generateMap(); player.tx = (nx<0)?MAP_SIZE-1:(nx>=MAP_SIZE)?0:nx; player.ty = (ny<0)?MAP_SIZE-1:(ny>=MAP_SIZE)?0:ny;
    } else if (map[ny][nx] !== 1) {
        player.tx = nx; player.ty = ny;
        if (typeof map[ny][nx] === "string") startBattle(nx, ny, map[ny][nx]);
    }
    updateUI();
});

generateMap();
updateUI();
draw();
</script>
</body>
</html>
