<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>永恆荒野 RPG - 戰鬥視角優化</title>
    <style>
        body { background: #1a1a1a; color: white; display: flex; flex-direction: column; align-items: center; font-family: "Microsoft JhengHei", sans-serif; margin: 0; overflow: hidden; }
        #game-container { position: relative; width: 600px; height: 400px; margin-top: 10px; border: 4px solid #333; }
        canvas { background: #000; display: block; }
        
        /* 基礎彈窗 (通用) */
        .overlay { display: none; position: absolute; top: 0; left: 0; width: 600px; height: 400px; background: rgba(0,0,0,0.85); flex-direction: column; align-items: center; z-index: 100; overflow-y: auto; padding-top: 20px; }

        /* --- 修改點：戰鬥畫面加大與置中 --- */
        #battle-screen {
            display: none; 
            position: absolute; 
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%); /* 精準置中 */
            width: 90%;  /* 加大寬度 */
            height: 90%; /* 加大高度 */
            background: rgba(10, 10, 10, 0.95); /* 更深的背景，強化對比 */
            border: 3px solid #e74c3c; /* 紅色邊框，增加緊張感 */
            border-radius: 12px;
            flex-direction: column; 
            align-items: center; 
            justify-content: center; /* 內容垂直置中 */
            z-index: 110; /* 層級稍高於一般彈窗 */
            box-shadow: 0 0 30px rgba(231, 76, 60, 0.5); /* 紅色外發光 */
            padding: 10px;
            box-sizing: border-box;
        }
        
        /* LEVEL UP 特效 */
        #level-up-display { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 64px; font-weight: 900; color: #f1c40f; text-shadow: 0 0 20px #fff; z-index: 1000; pointer-events: none; animation: levelUpPop 1.2s forwards; }
        @keyframes levelUpPop { 0% { opacity: 0; scale: 0.5; } 20% { opacity: 1; scale: 1.1; } 100% { opacity: 0; transform: translate(-50%, -150%); } }

        /* 戰鬥與血條 */
        #enemy-group { display: flex; gap: 15px; justify-content: center; margin-bottom: 10px; width: 100%; }
        .unit-card { text-align: center; width: 120px; }
        .hp-bar { width: 100%; height: 12px; background: #400; border: 1px solid #fff; position: relative; border-radius: 4px; overflow: hidden; }
        .hp-fill { height: 100%; background: #2ecc71; transition: width 0.3s; width: 100%; }
        .hp-text { position: absolute; width: 100%; text-align: center; font-size: 9px; line-height: 12px; color: white; top: 0; font-weight: bold; }
        
        /* 商店與戰利品 */
        .shop-section { width: 90%; background: #2c3e50; border-radius: 8px; padding: 10px; margin-bottom: 10px; border: 1px solid #34495e; }
        .loot-item { background: #34495e; padding: 10px; margin: 5px; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; width: 80%; }
        
        .btn { padding: 8px 15px; background: #444; color: white; border: 1px solid #fff; cursor: pointer; font-size: 12px; border-radius: 4px; margin: 2px; }
        .btn:hover { background: #666; border-color: #0fccff; }

        /* 特效層 */
        #flash-effect { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 1000; pointer-events: none; opacity: 0.4; }
        .shake { animation: shakeEffect 0.1s linear infinite; }
        @keyframes shakeEffect { 0% { transform: translate(2px, 2px); } 50% { transform: translate(-2px, -2px); } 100% { transform: translate(0,0); } }

        #ui { width: 580px; background: #222; padding: 10px; margin-top: 5px; border-radius: 8px; display: grid; grid-template-columns: 1fr 1.3fr; border: 1px solid #444; font-size: 13px; }
    </style>
</head>
<body>

<div id="flash-effect"></div>
<div id="game-container">
    <canvas id="gameCanvas" width="600" height="400"></canvas>
    <div id="level-up-display">LEVEL UP!</div>

    <div id="battle-screen">
        <h3 style="color: #e74c3c; margin: 0 0 10px 0; font-size: 20px; text-transform: uppercase; letter-spacing: 2px;">Battle Phase</h3>
        
        <div id="enemy-group"></div>
        
        <div style="width: 80%; border-top: 2px solid #444; margin: 15px 0;"></div> <div class="unit-card" style="width:220px; margin-bottom:15px; background: rgba(15, 202, 255, 0.1); padding: 8px; border-radius: 8px;">
            <div style="color:#0fccff; font-weight:bold; font-size: 14px; margin-bottom: 5px;">勇者 (玩家)</div>
            <div class="hp-bar" style="height: 16px;"><div id="p-hp-fill" class="hp-fill"></div><div id="p-hp-label" class="hp-text" style="font-size: 11px; line-height: 16px;"></div></div>
        </div>
        
        <div id="battle-log" style="font-size:15px; color:#ccc; min-height:50px; text-align:center; width: 90%; background: rgba(255,255,255,0.05); padding: 5px; border-radius: 4px; margin-bottom: 15px;"></div>
        
        <div class="actions" style="display: flex; gap: 10px;">
            <button class="btn" style="font-size: 14px; padding: 10px 20px; background: #8e44ad;" onclick="playerAttack()">1. 物理攻擊</button>
            <button class="btn" style="font-size: 14px; padding: 10px 20px; background: #27ae60;" onclick="playerHeal()">2. 治癒藥水 (<span id="btl-pot-count">0</span>)</button>
            <button class="btn" style="font-size: 14px; padding: 10px 20px; background: #c0392b;" onclick="tryEscape()">3. 嘗試逃跑</button>
        </div>
    </div>

    <div id="shop-screen" class="overlay">
        <h2 style="color: #f1c40f; margin:0;">村莊商店</h2>
        <div style="color: #0fccff; margin-bottom: 10px;">金幣：<span id="shop-gold">0</span></div>
        <div class="shop-section">
            <div style="color:#f1c40f">💪 體能訓練 (150G)</div>
            <button class="btn" onclick="buyStat('atk')">ATK+3</button>
            <button class="btn" onclick="buyStat('def')">DEF+2</button>
        </div>
        <div class="shop-section">
            <div style="color:#f1c40f">🎲 隨機商店 (刷新 50G)</div>
            <button class="btn" onclick="refreshRandomShop()">刷新物品</button>
            <div id="random-item-info" style="margin-top:5px; font-size:12px;"></div>
        </div>
        <div class="shop-section">
            <button class="btn" onclick="buyPotion()">買藥水 (80G)</button>
            <button class="btn" onclick="sellPotion()">賣藥水 (50G)</button>
        </div>
        <button class="btn" style="background:#c0392b" onclick="closeShop()">離開</button>
    </div>

    <div id="loot-screen" class="overlay">
        <h2 style="color: #f1c40f;">獲得戰利品</h2>
        <div id="loot-list" style="width:100%; display:flex; flex-direction:column; align-items:center;"></div>
        <button class="btn" style="background:#555" onclick="closeLoot()">放棄剩餘物品</button>
    </div>
</div>

<div id="ui">
    <div>
        <div style="color:#0fccff">Lv. <span id="lvl">1</span> | EXP: <span id="exp">0</span>/100</div>
        <div>金幣: <span id="gold-ui">0</span> | 藥水: <span id="ui-pot-count">0</span></div>
        <div style="font-size:11px; color:#888;">座標: (<span id="world-pos">0,0</span>)</div>
    </div>
    <div style="text-align: right;">
        <div style="color:#f1c40f">⚔️ <span id="eq-weapon">木棒</span> | 🛡️ <span id="eq-armor">布衣</span></div>
        <div style="font-size:11px; color:#aaa;">ATK: <span id="atk-total">0</span> | DEF: <span id="def-total">0</span></div>
        <div id="sub-stats" style="font-size:10px; color:#0fccff;"></div>
    </div>
</div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
const MAP_SIZE = 15;

let worldData = {}, currentWorldX = 0, currentWorldY = 0, map = [];
let inBattle = false, enemies = [], currentLoot = [], canInput = true, randomShopItem = null;

const player = {
    tx: 7, ty: 7, hp: 100, maxHp: 100, level: 1, exp: 0, gold: 100,
    baseAtk: 15, baseDef: 5, potions: 3,
    weapon: { name: "木棒", power: 2, crit: 5 },
    armor: { name: "布衣", power: 1, dodge: 2 }
};

const monsters = {
    "slime": { name: "史萊姆", baseHp: 35, atk: 8, def: 2, color: "#9b59b6", exp: 20 },
    "goblin": { name: "哥布林", baseHp: 65, atk: 16, def: 5, color: "#2ecc71", exp: 45 },
    "orc": { name: "獸人", baseHp: 160, atk: 28, def: 12, color: "#e67e22", exp: 90 }
};

function updateUI() {
    document.getElementById("p-hp-fill").style.width = (player.hp / player.maxHp * 100) + "%";
    document.getElementById("p-hp-label").innerText = `${Math.ceil(player.hp)}/${player.maxHp}`;
    document.getElementById("lvl").innerText = player.level;
    document.getElementById("exp").innerText = player.exp;
    document.getElementById("gold-ui").innerText = player.gold;
    document.getElementById("shop-gold").innerText = player.gold;
    document.getElementById("ui-pot-count").innerText = player.potions;
    document.getElementById("btl-pot-count").innerText = player.potions;
    document.getElementById("world-pos").innerText = `${currentWorldX},${currentWorldY}`;
    
    let totalAtk = player.baseAtk + player.weapon.power;
    let totalDef = player.baseDef + player.armor.power;
    document.getElementById("atk-total").innerText = totalAtk;
    document.getElementById("def-total").innerText = totalDef;
    document.getElementById("eq-weapon").innerText = player.weapon.name;
    document.getElementById("eq-armor").innerText = player.armor.name;
    document.getElementById("sub-stats").innerText = `暴擊: ${player.weapon.crit}% | 閃避: ${player.armor.dodge}%`;
}

// --- 戰鬥系統 ---
function startBattle(x, y, type) {
    inBattle = true; canInput = true;
    enemies = [];
    const count = Math.random() < 0.5 ? 1 : (Math.random() < 0.85 ? 2 : 3);
    const groupEl = document.getElementById("enemy-group");
    groupEl.innerHTML = "";

    for (let i = 0; i < count; i++) {
        let m = monsters[type];
        let hp = m.baseHp + (player.level * 12);
        enemies.push({ ...m, maxHp: hp, hp: hp, id: i });
        groupEl.innerHTML += `
            <div class="unit-card" style="background: rgba(255,255,255,0.05); padding: 5px; border-radius: 4px;">
                <div style="color:${m.color}; font-size:12px; font-weight:bold; margin-bottom:3px;">${m.name} ${i+1}</div>
                <div class="hp-bar"><div id="e-hp-fill-${i}" class="hp-fill" style="width:100%"></div><div id="e-hp-label-${i}" class="hp-text">${hp}/${hp}</div></div>
            </div>`;
    }
    enemies[0].pos = {x, y};
    document.getElementById("battle-screen").style.display = "flex"; /* 顯現加大置中的戰鬥畫面 */
    log(`進入戰鬥！遭遇 ${count} 隻敵人。使用數字鍵 1-3 控制。`);
    updateUI();
}

function playerAttack() {
    if (!inBattle || !canInput) return;
    canInput = false;
    let target = enemies.find(e => e.hp > 0);
    let isCrit = Math.random() * 100 < player.weapon.crit;
    
    if (isCrit) {
        document.getElementById("flash-effect").style.display = "block";
        setTimeout(() => document.getElementById("flash-effect").style.display = "none", 50);
        document.getElementById("game-container").classList.add("shake");
        setTimeout(() => document.getElementById("game-container").classList.remove("shake"), 200);
    }

    let dmg = Math.max(5, (player.baseAtk + player.weapon.power) - target.def) * (isCrit ? 2 : 1);
    target.hp -= dmg;
    
    document.getElementById(`e-hp-fill-${target.id}`).style.width = (Math.max(0, target.hp)/target.maxHp*100) + "%";
    document.getElementById(`e-hp-label-${target.id}`).innerText = `${Math.ceil(Math.max(0, target.hp))}/${target.maxHp}`;
    log(`⚔️ 對 ${target.name} 造成 ${Math.ceil(dmg)} 點${isCrit?'暴擊':'傷害'}`);

    if (enemies.every(e => e.hp <= 0)) {
        inBattle = false; setTimeout(winBattle, 500);
    } else {
        setTimeout(enemyTurn, 600);
    }
}

function enemyTurn() {
    if (!inBattle) return;
    let logMsg = "";
    enemies.forEach(en => {
        if (en.hp > 0) {
            let isDodge = Math.random() * 100 < player.armor.dodge;
            if (isDodge) {
                logMsg += `閃避了 ${en.name}！ `;
            } else {
                let dmg = Math.max(3, en.atk - (player.baseDef + player.armor.power));
                player.hp -= dmg;
                logMsg += `💥 ${en.name} 造成 ${Math.ceil(dmg)} 傷害。 `;
            }
        }
    });
    log(logMsg); updateUI();
    if (player.hp <= 0) { alert("你戰敗了..."); location.reload(); }
    canInput = true;
}

function winBattle() {
    let exp = 0; enemies.forEach(e => exp += e.exp);
    player.exp += exp; player.gold += (enemies.length * 20);
    map[enemies[0].pos.y][enemies[0].pos.x] = 0;
    
    if (player.exp >= 100) {
        player.level++; player.exp = 0; player.maxHp += 20; player.hp = player.maxHp;
        player.baseAtk += 3;
        const el = document.getElementById("level-up-display");
        el.style.display = "block"; setTimeout(() => el.style.display = "none", 1200);
    }

    currentLoot = [];
    if (Math.random() < 0.5) {
        let isWeapon = Math.random() > 0.5;
        currentLoot.push({
            name: isWeapon ? "神秘武器(武)" : "神秘防具(防)",
            type: isWeapon ? "weapon" : "armor",
            power: player.level * 4 + Math.floor(Math.random()*5),
            crit: isWeapon ? (5 + player.level) : 0,
            dodge: isWeapon ? 0 : (2 + player.level)
        });
    }
    if (Math.random() < 0.6) currentLoot.push({ name: "回復藥水", type: "item" });

    if (currentLoot.length === 0) closeLoot(); else showLoot();
}

// --- 商店功能 ---
function buyStat(type) {
    if (player.gold >= 150) {
        player.gold -= 150;
        if (type === 'atk') player.baseAtk += 3;
        else player.baseDef += 2;
        updateUI();
    }
}

function refreshRandomShop() {
    if (player.gold >= 50) {
        player.gold -= 50;
        const type = Math.random() > 0.5 ? "weapon" : "armor";
        randomShopItem = {
            name: type === "weapon" ? "黑金利刃" : "鋼鐵護甲",
            type: type,
            power: player.level * 6 + 10,
            price: 350,
            crit: type === "weapon" ? 15 : 0,
            dodge: type === "weapon" ? 0 : 10
        };
        document.getElementById("random-item-info").innerHTML = 
            `${randomShopItem.name} (+${randomShopItem.power}) <button class="btn" onclick="buyRandom()">350G 購買</button>`;
        updateUI();
    }
}

function buyRandom() {
    if (randomShopItem && player.gold >= randomShopItem.price) {
        player.gold -= randomShopItem.price;
        if (randomShopItem.type === 'weapon') player.weapon = randomShopItem;
        else player.armor = randomShopItem;
        randomShopItem = null;
        document.getElementById("random-item-info").innerText = "已購買！";
        updateUI();
    }
}

// --- 通用與 UI ---
function showLoot() {
    document.getElementById("battle-screen").style.display = "none";
    const screen = document.getElementById("loot-screen");
    const list = document.getElementById("loot-list");
    list.innerHTML = ""; screen.style.display = "flex";
    currentLoot.forEach((item, index) => {
        const div = document.createElement("div"); div.className = "loot-item";
        div.innerHTML = `<span>${item.name} ${item.power ? '(+'+item.power+')' : ''}</span>`;
        const b = document.createElement("button"); b.className = "btn"; b.innerText = "拾取";
        b.onclick = () => {
            if (item.type === "item") player.potions++;
            else if (item.type === "weapon") player.weapon = item;
            else if (item.type === "armor") player.armor = item;
            currentLoot.splice(index, 1);
            if (currentLoot.length === 0) closeLoot(); else showLoot();
            updateUI();
        };
        div.appendChild(b); list.appendChild(div);
    });
}

function playerHeal() {
    if (player.potions > 0 && canInput) {
        player.potions--; player.hp = Math.min(player.maxHp, player.hp + 50);
        updateUI(); if (inBattle) { canInput = false; log("使用了藥水。"); setTimeout(enemyTurn, 600); }
    }
}

function tryEscape() {
    if (Math.random() < 0.4) { 
        document.getElementById("battle-screen").style.display = "none"; 
        inBattle = false; 
        log("逃跑成功。");
    } else { 
        log("逃跑失敗！被迫迎戰。"); 
        canInput = false; 
        setTimeout(enemyTurn, 600); 
    }
}

function closeLoot() { document.getElementById("loot-screen").style.display = "none"; inBattle = false; updateUI(); }
function closeShop() { document.getElementById("shop-screen").style.display = "none"; }
function buyPotion() { if(player.gold>=80){ player.gold-=80; player.potions++; updateUI(); } }
function sellPotion() { if(player.potions>0){ player.potions--; player.gold+=50; updateUI(); } }
function log(m) { document.getElementById("battle-log").innerText = m; }

function loadRegion(wx, wy) {
    const key = `${wx},${wy}`;
    if (worldData[key]) return worldData[key];
    let newMap = [];
    for (let y = 0; y < MAP_SIZE; y++) {
        newMap[y] = [];
        for (let x = 0; x < MAP_SIZE; x++) {
            if (x === 0 || y === 0 || x === MAP_SIZE-1 || y === MAP_SIZE-1) newMap[y][x] = (Math.abs(x-7)<=1 || Math.abs(y-7)<=1) ? 0 : 1;
            else if (wx === 0 && wy === 0 && x === 7 && y === 7) newMap[y][x] = "shop";
            else { let r = Math.random(); newMap[y][x] = r < 0.08 ? 1 : r < 0.13 ? Object.keys(monsters)[Math.floor(Math.random()*3)] : 0; }
        }
    }
    worldData[key] = newMap; return newMap;
}

function draw() {
    ctx.clearRect(0,0,600,400);
    const offsetX = 300-(player.tx*40+20), offsetY = 200-(player.ty*40+20);
    ctx.save(); ctx.translate(offsetX, offsetY);
    for (let y=0; y<MAP_SIZE; y++) {
        for (let x=0; x<MAP_SIZE; x++) {
            let t = map[y][x]; ctx.fillStyle = t === "shop" ? "#f1c40f" : t === 1 ? "#444" : t === 0 ? "#222" : monsters[t].color;
            ctx.fillRect(x*40, y*40, 38, 38);
        }
    }
    ctx.fillStyle = "#00ffcc"; ctx.fillRect(player.tx*40+5, player.ty*40+5, 30, 30);
    ctx.restore(); requestAnimationFrame(draw);
}

// --- 修改點：恢復數字鍵 1-3 控制戰鬥 ---
window.addEventListener("keydown", e => {
    // 優先處理戰鬥輸入
    if (inBattle) {
        if (canInput) {
            if (e.key === "1") playerAttack();
            else if (e.key === "2") playerHeal();
            else if (e.key === "3") tryEscape();
        }
        return; // 戰鬥中攔截方向鍵移動
    }
    
    // 商店或戰利品介面攔截移動
    if (document.getElementById("shop-screen").style.display === "flex" || document.getElementById("loot-screen").style.display === "flex") return;
    
    // 地圖移動邏輯
    let nx = player.tx, ny = player.ty;
    if (e.key === "ArrowUp") ny--; else if (e.key === "ArrowDown") ny++; else if (e.key === "ArrowLeft") nx--; else if (e.key === "ArrowRight") nx++;
    
    if (nx < 0) switchRegion(-1, 0); else if (nx >= MAP_SIZE) switchRegion(1, 0); else if (ny < 0) switchRegion(0, -1); else if (ny >= MAP_SIZE) switchRegion(0, 1);
    else if (map[ny][nx] !== 1) { 
        player.tx = nx; player.ty = ny; 
        if (map[ny][nx] === "shop") document.getElementById("shop-screen").style.display = "flex";
        else if (typeof map[ny][nx] === "string") startBattle(nx, ny, map[ny][nx]); 
    }
    updateUI();
});

function switchRegion(dx, dy) {
    currentWorldX += dx; currentWorldY += dy; map = loadRegion(currentWorldX, currentWorldY);
    if (dx === 1) player.tx = 0; else if (dx === -1) player.tx = MAP_SIZE-1;
    else if (dy === 1) player.ty = 0; else if (dy === -1) player.ty = MAP_SIZE-1;
    updateUI();
}

map = loadRegion(0, 0); updateUI(); draw();
</script>
</body>
</html>
