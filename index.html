<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>永恆荒野 RPG - 最終完整加強版</title>
    <style>
        body { background: #1a1a1a; color: white; display: flex; flex-direction: column; align-items: center; font-family: "Microsoft JhengHei", sans-serif; margin: 0; overflow: hidden; }
        #game-container { position: relative; width: 900px; height: 600px; margin-top: 10px; border: 4px solid #444; }
        canvas { background: #000; display: block; }
        #coord-tag { position: absolute; top: 15px; left: 15px; background: rgba(0,0,0,0.8); padding: 8px 15px; border-radius: 20px; border: 1px solid #0fccff; color: #0fccff; font-size: 14px; font-weight: bold; z-index: 50; }
        #flash-effect { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 1000; pointer-events: none; opacity: 0.5; }
        .overlay { display: none; position: absolute; top: 0; left: 0; width: 900px; height: 600px; background: rgba(0,0,0,0.9); flex-direction: column; align-items: center; z-index: 100; padding-top: 20px; box-sizing: border-box; }
        #battle-screen { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 90%; height: 85%; background: rgba(10, 10, 10, 0.98); border: 3px solid #e74c3c; border-radius: 15px; flex-direction: column; align-items: center; justify-content: center; z-index: 110; padding: 15px; }
        .hp-bar { width: 100%; height: 18px; background: #400; border: 1px solid #fff; position: relative; border-radius: 4px; overflow: hidden; }
        .hp-fill { height: 100%; background: #2ecc71; transition: width 0.3s; width: 100%; }
        .hp-text { position: absolute; width: 100%; text-align: center; font-size: 11px; line-height: 18px; color: white; top: 0; font-weight: bold; }
        .btn { padding: 10px 20px; background: #333; color: white; border: 1px solid #fff; cursor: pointer; font-size: 14px; border-radius: 6px; margin: 5px; transition: 0.2s; }
        .btn:hover { background: #555; border-color: #0fccff; transform: scale(1.05); }
        #ui { width: 880px; background: #222; padding: 15px; margin-top: 10px; border-radius: 10px; display: grid; grid-template-columns: 1fr 1fr; border: 2px solid #444; }
        .diff-pos { color: #2ecc71; font-weight: bold; }
        .diff-neg { color: #e74c3c; font-weight: bold; }
    </style>
</head>
<body>

<div id="flash-effect"></div>
<div id="game-container">
    <div id="coord-tag">🗺️ 座標: [<span id="pos-display">0, 0</span>] <span id="danger-lvl"></span></div>
    <canvas id="gameCanvas" width="900" height="600"></canvas>

    <div id="battle-screen">
        <h2 style="color: #e74c3c; margin: 0 0 10px 0;">BATTLE</h2>
        <div id="enemy-group" style="display:flex; gap:15px; margin-bottom:20px; flex-wrap: wrap; justify-content: center;"></div>
        <div style="width:280px; background: rgba(15, 202, 255, 0.1); padding: 10px; border-radius: 10px; border: 1px solid #0fccff; margin-bottom: 15px;">
            <div style="color:#0fccff; font-weight:bold; font-size:14px;">勇者 HP</div>
            <div class="hp-bar"><div id="p-hp-fill" class="hp-fill"></div><div id="p-hp-label" class="hp-text"></div></div>
        </div>
        <div id="battle-log" style="font-size:15px; color:#eee; min-height:45px; text-align:center; width: 90%; background: rgba(255,255,255,0.05); padding: 8px; border-radius: 8px;">準備戰鬥...</div>
        <div class="actions">
            <button class="btn" onclick="playerAttack()">[1] 攻擊</button>
            <button class="btn" onclick="playerHeal()">[2] 藥水</button>
            <button class="btn" style="background:#8e44ad!important" onclick="useTeleport()">[T] 傳送石</button>
            <button class="btn" onclick="tryEscape()">[3] 逃跑</button>
        </div>
    </div>

    <div id="shop-screen" class="overlay">
        <h1 style="color: #f1c40f; margin-bottom: 5px;">村莊商店</h1>
        <p>持有金幣: <b style="color:#f1c40f"><span id="shop-gold">0</span> G</b></p>
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:15px; width:90%;">
            <div style="background:#333; padding:15px; border-radius:8px;">
                <b style="color:#f1c40f">🎲 隨機裝備 (50G)</b><br>
                <button class="btn" style="width:100%" onclick="refreshRandomShop()">刷新貨架</button>
                <div id="random-item-info" style="margin-top:10px; font-size:13px; background:#111; padding:8px; min-height:80px; border: 1px dashed #555;"></div>
            </div>
            <div style="background:#333; padding:15px; border-radius:8px;">
                <b style="color:#2ecc71">🧪 補給與強化</b><br>
                <button class="btn" style="width:100%" onclick="buyPotion()">補血藥水 (80G)</button>
                <button class="btn" style="background:#8e44ad!important; width:100%" onclick="buyTeleport()">傳送石 (150G)</button>
                <hr style="border:0; border-top:1px solid #555; margin:10px 0;">
                <button class="btn" style="width:100%; font-size:12px;" onclick="buyPermanent('atk')">力量靈藥 <span id="atk-price">75</span>G (ATK+5)</button>
                <button class="btn" style="width:100%; font-size:12px;" onclick="buyPermanent('hp')">生命靈藥 <span id="hp-price">75</span>G (HP+20)</button>
            </div>
        </div>
        <button class="btn" style="margin-top:20px; width:200px;" onclick="closeShop()">離開</button>
    </div>

    <div id="loot-screen" class="overlay">
        <h2 style="color: #f1c40f;">獲得戰利品</h2>
        <div id="loot-list" style="margin-bottom: 20px;"></div>
        <button class="btn" onclick="closeLoot()">繼續冒險</button>
    </div>
</div>

<div id="ui">
    <div>
        <div style="color:#0fccff; font-size: 20px; font-weight: bold;">Lv. <span id="lvl">1</span> | EXP: <span id="exp">0</span>/100</div>
        <div>💰 金幣: <span id="gold-ui">0</span> | 🧪 藥水: <span id="ui-pot-count">0</span> | 🔮 傳送石: <span id="ui-tp-count">0</span></div>
    </div>
    <div style="text-align: right;">
        <div style="color:#f1c40f; font-weight:bold;">⚔️ <span id="eq-weapon">木棒</span> | 🛡️ <span id="eq-armor">布衣</span></div>
        <div style="font-size:12px; color:#aaa;">ATK: <span id="atk-total">0</span> (爆擊 <span id="ui-crit">0</span>%) | DEF: <span id="def-total">0</span> (閃避 <span id="ui-dodge">0</span>%)</div>
    </div>
</div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
const MAP_SIZE = 15, TILE_SIZE = 50;

let worldData = {}, currentWorldX = 0, currentWorldY = 0, map = [];
let inBattle = false, enemies = [], currentLoot = [], canInput = true, randomShopItem = null;

const player = {
    tx: 7, ty: 7, hp: 100, maxHp: 100, level: 1, exp: 0, gold: 100,
    baseAtk: 15, baseDef: 5, potions: 3, teleportStones: 1,
    weapon: { name: "木棒", power: 2, crit: 5 },
    armor: { name: "布衣", power: 1, dodge: 2 },
    atkBought: 0, hpBought: 0
};

const monsters = {
    "slime": { name: "史萊姆", baseHp: 35, atk: 8, def: 2, color: "#9b59b6", exp: 20, skill: "黏液噴射" },
    "goblin": { name: "哥布林", baseHp: 65, atk: 16, def: 5, color: "#2ecc71", exp: 45, skill: "瘋狂亂抓" },
    "orc": { name: "獸人", baseHp: 160, atk: 28, def: 12, color: "#e67e22", exp: 90, skill: "大地粉碎" },
    "stalker": { name: "荒野獵殺者", baseHp: 220, atk: 45, def: 15, color: "#e74c3c", exp: 150, skill: "暗影襲擊" }
};

function updateUI() {
    const dist = Math.abs(currentWorldX) + Math.abs(currentWorldY);
    document.getElementById("pos-display").innerText = `${currentWorldX}, ${currentWorldY}`;
    document.getElementById("danger-lvl").innerText = dist > 0 ? `(危險度: ${dist})` : `(村莊)`;
    document.getElementById("lvl").innerText = player.level;
    document.getElementById("exp").innerText = player.exp;
    document.getElementById("gold-ui").innerText = player.gold;
    document.getElementById("shop-gold").innerText = player.gold;
    document.getElementById("ui-pot-count").innerText = player.potions;
    document.getElementById("ui-tp-count").innerText = player.teleportStones;
    document.getElementById("p-hp-fill").style.width = (player.hp / player.maxHp * 100) + "%";
    document.getElementById("p-hp-label").innerText = `${Math.ceil(player.hp)}/${player.maxHp}`;
    document.getElementById("atk-total").innerText = player.baseAtk + player.weapon.power;
    document.getElementById("def-total").innerText = player.baseDef + player.armor.power;
    document.getElementById("ui-crit").innerText = player.weapon.crit;
    document.getElementById("ui-dodge").innerText = player.armor.dodge;
    document.getElementById("atk-price").innerText = 75 + (player.atkBought * 100);
    document.getElementById("hp-price").innerText = 75 + (player.hpBought * 100);
}

function buyPermanent(stat) {
    let price = (stat === 'atk') ? 75 + (player.atkBought * 100) : 75 + (player.hpBought * 100);
    if (player.gold >= price) {
        player.gold -= price;
        if (stat === 'atk') { player.baseAtk += 5; player.atkBought++; }
        else { player.maxHp += 20; player.hp = player.maxHp; player.hpBought++; }
        updateUI();
    }
}

function startBattle(x, y, monsterData) {
    inBattle = true; canInput = true;
    const dist = Math.abs(currentWorldX) + Math.abs(currentWorldY);
    const mult = 1 + (dist * 0.2);
    if (!monsterData.enemyList) {
        let count = (monsterData.type === "stalker") ? 1 : Math.floor(Math.random() * 3) + 1;
        monsterData.enemyList = [];
        let m = monsters[monsterData.type];
        for (let i = 0; i < count; i++) {
            let hp = Math.floor((m.baseHp + (player.level * 10)) * mult);
            monsterData.enemyList.push({ ...m, maxHp: hp, hp: hp, atk: Math.floor(m.atk * mult), def: Math.floor(m.def * mult), exp: Math.floor(m.exp * mult), id: i });
        }
    }
    enemies = monsterData.enemyList;
    const groupEl = document.getElementById("enemy-group"); groupEl.innerHTML = "";
    enemies.forEach(en => {
        if (en.hp > 0) {
            groupEl.innerHTML += `<div id="en-box-${en.id}" style="background:#222; padding:10px; border-radius:8px; width:130px; border: 1px solid ${en.color};">
                <div style="color:${en.color}; font-size:12px; font-weight:bold; margin-bottom:5px;">${en.name}</div>
                <div class="hp-bar"><div id="e-hp-fill-${en.id}" class="hp-fill" style="width:${(en.hp/en.maxHp*100)}%"></div><div id="e-hp-label-${en.id}" class="hp-text">${Math.ceil(en.hp)}/${en.maxHp}</div></div>
            </div>`;
        }
    });
    document.getElementById("battle-screen").style.display = "flex";
    log(`戰鬥開始！血量已鎖定。`); updateUI();
}

function playerAttack() {
    if (!inBattle || !canInput) return;
    let target = enemies.find(e => e.hp > 0); if (!target) return;
    canInput = false;
    let isCrit = Math.random() * 100 < player.weapon.crit;
    if (isCrit) {
        const f = document.getElementById("flash-effect"); f.style.display = "block";
        setTimeout(() => f.style.display = "none", 50);
    }
    let dmg = Math.max(5, (player.baseAtk + player.weapon.power) - target.def) * (isCrit ? 2 : 1);
    target.hp -= dmg;
    document.getElementById(`e-hp-fill-${target.id}`).style.width = (Math.max(0, target.hp)/target.maxHp*100) + "%";
    document.getElementById(`e-hp-label-${target.id}`).innerText = `${Math.ceil(Math.max(0, target.hp))}/${target.maxHp}`;
    log(`${isCrit ? '🔥 爆擊！' : '⚔️'} 擊中 ${target.name} 造成 ${Math.ceil(dmg)} 傷害`);
    if (target.hp <= 0) document.getElementById(`en-box-${target.id}`).style.opacity = "0.3";
    if (enemies.every(e => e.hp <= 0)) setTimeout(winBattle, 500); else setTimeout(enemyTurn, 600);
}

function enemyTurn() {
    if (!inBattle) return;
    let logMsg = "";
    enemies.forEach(en => {
        if (en.hp > 0) {
            if (Math.random() * 100 < player.armor.dodge) logMsg += `💨 閃過！ `;
            else {
                let dmg = Math.random() < 0.3 ? Math.max(10, (en.atk * 1.3) - (player.baseDef + player.armor.power)) : Math.max(3, en.atk - (player.baseDef + player.armor.power));
                player.hp -= dmg; logMsg += `💥 ${en.name}使用${en.skill}！ `;
            }
        }
    });
    log(logMsg); updateUI();
    if (player.hp <= 0) handlePlayerDeath(); else canInput = true;
}

function winBattle() {
    let expGained = 0; enemies.forEach(e => expGained += e.exp);
    player.exp += expGained; player.gold += (enemies.length * 60);
    worldData[`${currentWorldX},${currentWorldY}`][player.ty][player.tx] = 0; 
    if (player.exp >= 100) { player.level++; player.exp = 0; player.maxHp += 20; player.hp = player.maxHp; player.baseAtk += 5; }
    currentLoot = [];
    if (Math.random() < 0.6) currentLoot.push({ name: "藥水", type: "item" });
    if (Math.random() < 0.2) currentLoot.push({ name: "傳送石", type: "tp" });
    showLoot();
}

function loadRegion(wx, wy) {
    const key = `${wx},${wy}`; if (worldData[key]) return worldData[key];
    let newMap = []; const dist = Math.abs(wx) + Math.abs(wy);
    for (let y = 0; y < MAP_SIZE; y++) {
        newMap[y] = [];
        for (let x = 0; x < MAP_SIZE; x++) {
            if (x === 0 || y === 0 || x === MAP_SIZE-1 || y === MAP_SIZE-1) newMap[y][x] = (Math.abs(x-7)<=1 || Math.abs(y-7)<=1) ? 0 : 1;
            else if (wx === 0 && wy === 0 && x === 7 && y === 7) newMap[y][x] = "shop";
            else {
                if (Math.random() < 0.1) {
                    let type = ["slime", "goblin", "orc"][Math.floor(Math.random()*3)];
                    if (dist >= 3 && Math.random() < 0.3) type = "stalker";
                    newMap[y][x] = { type, enemyList: null };
                } else newMap[y][x] = 0;
            }
        }
    }
    worldData[key] = newMap; return newMap;
}

function draw() {
    ctx.clearRect(0,0,900,600);
    const offsetX = 450-(player.tx*TILE_SIZE + TILE_SIZE/2), offsetY = 300-(player.ty*TILE_SIZE + TILE_SIZE/2);
    ctx.save(); ctx.translate(offsetX, offsetY);
    for (let y=0; y<MAP_SIZE; y++) {
        for (let x=0; x<MAP_SIZE; x++) {
            let t = map[y][x]; 
            ctx.fillStyle = t === 0 ? "#111" : t === 1 ? "#333" : t === "shop" ? "#f1c40f" : monsters[t.type].color;
            ctx.fillRect(x*TILE_SIZE, y*TILE_SIZE, TILE_SIZE-2, TILE_SIZE-2);
        }
    }
    ctx.fillStyle = "#00ffcc"; ctx.fillRect(player.tx*TILE_SIZE+10, player.ty*TILE_SIZE+10, TILE_SIZE-20, TILE_SIZE-20);
    ctx.restore(); requestAnimationFrame(draw);
}

window.addEventListener("keydown", e => {
    if (inBattle && canInput) {
        if (e.key === "1") playerAttack(); else if (e.key === "2") playerHeal(); else if (e.key === "3") tryEscape(); else if (e.key.toLowerCase() === "t") useTeleport();
        return;
    }
    if (document.getElementById("shop-screen").style.display === "flex") return;
    let nx = player.tx, ny = player.ty;
    if (e.key === "ArrowUp") ny--; else if (e.key === "ArrowDown") ny++; else if (e.key === "ArrowLeft") nx--; else if (e.key === "ArrowRight") nx++;
    if (nx >= 0 && nx < MAP_SIZE && ny >= 0 && ny < MAP_SIZE && map[ny][nx] !== 1) { 
        player.tx = nx; player.ty = ny; 
        if (map[ny][nx] === "shop") { document.getElementById("shop-screen").style.display = "flex"; updateUI(); }
        else if (map[ny][nx] !== 0) startBattle(nx, ny, map[ny][nx]); 
    } else if (nx < 0 || nx >= MAP_SIZE || ny < 0 || ny >= MAP_SIZE) {
        if (nx < 0) { currentWorldX--; player.tx = MAP_SIZE-1; }
        else if (nx >= MAP_SIZE) { currentWorldX++; player.tx = 0; }
        else if (ny < 0) { currentWorldY--; player.ty = MAP_SIZE-1; }
        else if (ny >= MAP_SIZE) { currentWorldY++; player.ty = 0; }
        map = loadRegion(currentWorldX, currentWorldY);
    }
    updateUI();
});

function handlePlayerDeath() {
    canInput = false;
    setTimeout(() => {
        inBattle = false; document.getElementById("battle-screen").style.display = "none";
        currentWorldX = 0; currentWorldY = 0; map = loadRegion(0, 0); player.tx = 7; player.ty = 7;
        player.hp = player.maxHp * 0.5; updateUI(); canInput = true;
    }, 1000);
}
function playerHeal() { if (player.potions > 0 && canInput) { player.potions--; player.hp = Math.min(player.maxHp, player.hp + 50); updateUI(); if (inBattle) { canInput = false; setTimeout(enemyTurn, 600); } } }
function tryEscape() { if (Math.random() < 0.4) { document.getElementById("battle-screen").style.display = "none"; inBattle = false; } else { log("逃跑失敗！"); canInput = false; setTimeout(enemyTurn, 600); } }
function useTeleport() { if (player.teleportStones > 0) { player.teleportStones--; inBattle = false; document.getElementById("battle-screen").style.display = "none"; currentWorldX = 0; currentWorldY = 0; map = loadRegion(0,0); player.tx = 7; player.ty = 7; updateUI(); } }
function refreshRandomShop() {
    if (player.gold >= 50) {
        player.gold -= 50; const type = Math.random() > 0.5 ? "weapon" : "armor";
        const power = (player.level + Math.abs(currentWorldX)) * 8 + Math.floor(Math.random() * 15);
        const sub = 10 + Math.floor(Math.random() * 10); const price = 200 + Math.floor(Math.random() * 100);
        randomShopItem = { name: type === "weapon" ? "魔法劍" : "銀甲", type, power, price, crit: type === "weapon" ? sub : 0, dodge: type === "weapon" ? 0 : sub };
        const diff = power - (type === "weapon" ? player.weapon.power : player.armor.power);
        document.getElementById("random-item-info").innerHTML = `威力: ${power} (<span class="${diff>=0?'diff-pos':'diff-neg'}">${diff>=0?'+':''}${diff}</span>)<br>${type==="weapon"?"爆擊":"閃避"} +${sub}%<br>${price}G <button class="btn" style="width:100%" onclick="buyRandom()">購買</button>`;
        updateUI();
    }
}
function buyRandom() { if (randomShopItem && player.gold >= randomShopItem.price) { player.gold -= randomShopItem.price; if (randomShopItem.type === "weapon") player.weapon = randomShopItem; else player.armor = randomShopItem; randomShopItem = null; document.getElementById("random-item-info").innerHTML = "已裝備"; updateUI(); } }
function buyPotion() { if(player.gold>=80){ player.gold-=80; player.potions++; updateUI(); } }
function buyTeleport() { if(player.gold>=150){ player.gold-=150; player.teleportStones++; updateUI(); } }
function showLoot() { document.getElementById("battle-screen").style.display = "none"; const screen = document.getElementById("loot-screen"); const list = document.getElementById("loot-list"); list.innerHTML = ""; screen.style.display = "flex"; currentLoot.forEach((item, index) => { const b = document.createElement("button"); b.className = "btn"; b.innerText = `拾取 ${item.name}`; b.onclick = () => { if(item.type === "tp") player.teleportStones++; else player.potions++; currentLoot.splice(index, 1); if(currentLoot.length === 0) closeLoot(); else showLoot(); }; list.appendChild(b); }); if(currentLoot.length === 0) closeLoot(); }
function closeShop() { document.getElementById("shop-screen").style.display = "none"; }
function closeLoot() { document.getElementById("loot-screen").style.display = "none"; inBattle = false; updateUI(); }
function log(m) { document.getElementById("battle-log").innerText = m; }

map = loadRegion(0, 0); updateUI(); draw();
</script>
</body>
</html>
