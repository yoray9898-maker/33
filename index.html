<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>永恆荒野 RPG - 大螢幕豪華版</title>
    <style>
        body { background: #1a1a1a; color: white; display: flex; flex-direction: column; align-items: center; font-family: "Microsoft JhengHei", sans-serif; margin: 0; overflow: hidden; }
        
        /* --- 修改點：容器與畫布加大到 900x600 --- */
        #game-container { position: relative; width: 900px; height: 600px; margin-top: 10px; border: 4px solid #444; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        canvas { background: #000; display: block; }
        
        /* 基礎彈窗 (通用) */
        .overlay { display: none; position: absolute; top: 0; left: 0; width: 900px; height: 600px; background: rgba(0,0,0,0.85); flex-direction: column; align-items: center; z-index: 100; overflow-y: auto; padding-top: 20px; }

        /* 戰鬥畫面置中加大 */
        #battle-screen {
            display: none; 
            position: absolute; 
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%); 
            width: 85%;  
            height: 80%; 
            background: rgba(10, 10, 10, 0.98); 
            border: 3px solid #e74c3c; 
            border-radius: 15px;
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            z-index: 110; 
            box-shadow: 0 0 50px rgba(231, 76, 60, 0.4); 
            padding: 20px;
            box-sizing: border-box;
        }
        
        #level-up-display { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 80px; font-weight: 900; color: #f1c40f; text-shadow: 0 0 30px #fff; z-index: 1000; pointer-events: none; animation: levelUpPop 1.5s forwards; }
        @keyframes levelUpPop { 0% { opacity: 0; scale: 0.5; } 20% { opacity: 1; scale: 1.2; } 100% { opacity: 0; transform: translate(-50%, -200%); } }

        /* 戰鬥血條樣式 */
        #enemy-group { display: flex; gap: 30px; justify-content: center; margin-bottom: 20px; width: 100%; }
        .unit-card { text-align: center; width: 160px; }
        .hp-bar { width: 100%; height: 16px; background: #400; border: 1px solid #fff; position: relative; border-radius: 5px; overflow: hidden; }
        .hp-fill { height: 100%; background: #2ecc71; transition: width 0.3s; width: 100%; }
        .hp-text { position: absolute; width: 100%; text-align: center; font-size: 11px; line-height: 16px; color: white; top: 0; font-weight: bold; }
        
        .shop-section { width: 90%; background: #2c3e50; border-radius: 10px; padding: 15px; margin-bottom: 15px; border: 1px solid #34495e; }
        .loot-item { background: #34495e; padding: 15px; margin: 8px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; width: 85%; }
        
        .btn { padding: 12px 24px; background: #444; color: white; border: 1px solid #fff; cursor: pointer; font-size: 14px; border-radius: 6px; margin: 5px; transition: 0.2s; }
        .btn:hover { background: #666; border-color: #0fccff; transform: translateY(-2px); }

        /* 特效層 */
        #flash-effect { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 1000; pointer-events: none; opacity: 0.5; }
        .shake { animation: shakeEffect 0.1s linear infinite; }
        @keyframes shakeEffect { 0% { transform: translate(3px, 3px); } 50% { transform: translate(-3px, -3px); } 100% { transform: translate(0,0); } }

        /* UI 面板加大 */
        #ui { width: 880px; background: #222; padding: 15px; margin-top: 10px; border-radius: 10px; display: grid; grid-template-columns: 1fr 1fr; border: 2px solid #444; font-size: 15px; }
    </style>
</head>
<body>

<div id="flash-effect"></div>
<div id="game-container">
    <canvas id="gameCanvas" width="900" height="600"></canvas>
    <div id="level-up-display">LEVEL UP!</div>

    <div id="battle-screen">
        <h2 style="color: #e74c3c; margin: 0 0 20px 0; font-size: 28px; letter-spacing: 4px;">ENCOUNTER</h2>
        
        <div id="enemy-group"></div>
        
        <div style="width: 90%; border-top: 2px solid #333; margin: 20px 0;"></div>
        
        <div class="unit-card" style="width:280px; margin-bottom:20px; background: rgba(15, 202, 255, 0.1); padding: 12px; border-radius: 10px; border: 1px solid #0fccff;">
            <div style="color:#0fccff; font-weight:bold; font-size: 18px; margin-bottom: 8px;">勇者 (YOU)</div>
            <div class="hp-bar" style="height: 20px;"><div id="p-hp-fill" class="hp-fill"></div><div id="p-hp-label" class="hp-text" style="font-size: 13px; line-height: 20px;"></div></div>
        </div>
        
        <div id="battle-log" style="font-size:18px; color:#eee; min-height:60px; text-align:center; width: 90%; background: rgba(0,0,0,0.3); padding: 10px; border-radius: 8px; margin-bottom: 20px; border: 1px dashed #555;"></div>
        
        <div class="actions">
            <button class="btn" style="background: #8e44ad;" onclick="playerAttack()">[1] 物理攻擊</button>
            <button class="btn" style="background: #27ae60;" onclick="playerHeal()">[2] 治癒藥水 (<span id="btl-pot-count">0</span>)</button>
            <button class="btn" style="background: #c0392b;" onclick="tryEscape()">[3] 嘗試逃跑</button>
        </div>
    </div>

    <div id="shop-screen" class="overlay">
        <h1 style="color: #f1c40f; margin-bottom: 10px;">村莊大商店</h1>
        <div style="font-size: 20px; color: #0fccff; margin-bottom: 20px;">目前持有金幣：<span id="shop-gold">0</span> G</div>
        
        <div class="shop-section">
            <div style="color:#f1c40f; font-size: 18px; margin-bottom: 10px;">💪 體能訓練所 (永久提升屬性)</div>
            <button class="btn" onclick="buyStat('atk')">提升攻擊力 (ATK+3) - 150G</button>
            <button class="btn" onclick="buyStat('def')">提升防禦力 (DEF+2) - 150G</button>
        </div>
        
        <div class="shop-section">
            <div style="color:#f1c40f; font-size: 18px; margin-bottom: 10px;">🎲 旅人神祕商店 (隨機裝備)</div>
            <button class="btn" onclick="refreshRandomShop()">支付 50G 刷新貨架</button>
            <div id="random-item-info" style="margin-top:15px; font-size:16px; color:#ccc; border: 1px solid #444; padding: 10px; border-radius: 5px;"></div>
        </div>
        
        <div class="shop-section">
            <button class="btn" onclick="buyPotion()">購買藥水 (80G)</button>
            <button class="btn" onclick="sellPotion()">出售藥水 (50G)</button>
        </div>
        <button class="btn" style="background:#c0392b; width: 200px;" onclick="closeShop()">離開村莊</button>
    </div>

    <div id="loot-screen" class="overlay">
        <h2 style="color: #f1c40f; font-size: 32px;">獲得戰利品</h2>
        <div id="loot-list" style="width:100%; display:flex; flex-direction:column; align-items:center;"></div>
        <button class="btn" style="background:#555; margin-top: 20px;" onclick="closeLoot()">放棄其餘物品</button>
    </div>
</div>

<div id="ui">
    <div>
        <div style="color:#0fccff; font-size: 20px; font-weight: bold;">等級 <span id="lvl">1</span> | 經驗: <span id="exp">0</span>/100</div>
        <div style="margin-top: 5px;">金幣: <span id="gold-ui">0</span> | 藥水: <span id="ui-pot-count">0</span></div>
        <div style="font-size:13px; color:#888;">當前座標: (<span id="world-pos">0,0</span>)</div>
    </div>
    <div style="text-align: right;">
        <div style="color:#f1c40f; font-size: 18px;">⚔️ <span id="eq-weapon">木棒</span> | 🛡️ <span id="eq-armor">布衣</span></div>
        <div style="font-size:14px; color:#aaa; margin: 5px 0;">總攻擊力: <span id="atk-total">0</span> | 總防禦力: <span id="def-total">0</span></div>
        <div id="sub-stats" style="font-size:13px; color:#0fccff;">暴擊率: 5% | 閃避率: 2%</div>
    </div>
</div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
const MAP_SIZE = 15;
const TILE_SIZE = 50; // 配合 900 寬度稍微加大格尺寸

let worldData = {}, currentWorldX = 0, currentWorldY = 0, map = [];
let inBattle = false, enemies = [], currentLoot = [], canInput = true, randomShopItem = null;

const player = {
    tx: 7, ty: 7, hp: 100, maxHp: 100, level: 1, exp: 0, gold: 100,
    baseAtk: 15, baseDef: 5, potions: 3,
    weapon: { name: "木棒", power: 2, crit: 5 },
    armor: { name: "布衣", power: 1, dodge: 2 }
};

const monsters = {
    "slime": { name: "史萊姆", baseHp: 35, atk: 8, def: 2, color: "#9b59b6", exp: 20 },
    "goblin": { name: "哥布林", baseHp: 65, atk: 16, def: 5, color: "#2ecc71", exp: 45 },
    "orc": { name: "獸人", baseHp: 160, atk: 28, def: 12, color: "#e67e22", exp: 90 }
};

function updateUI() {
    document.getElementById("p-hp-fill").style.width = (player.hp / player.maxHp * 100) + "%";
    document.getElementById("p-hp-label").innerText = `${Math.ceil(player.hp)}/${player.maxHp}`;
    document.getElementById("lvl").innerText = player.level;
    document.getElementById("exp").innerText = player.exp;
    document.getElementById("gold-ui").innerText = player.gold;
    document.getElementById("shop-gold").innerText = player.gold;
    document.getElementById("ui-pot-count").innerText = player.potions;
    document.getElementById("btl-pot-count").innerText = player.potions;
    document.getElementById("world-pos").innerText = `${currentWorldX},${currentWorldY}`;
    
    let totalAtk = player.baseAtk + player.weapon.power;
    let totalDef = player.baseDef + player.armor.power;
    document.getElementById("atk-total").innerText = totalAtk;
    document.getElementById("def-total").innerText = totalDef;
    document.getElementById("eq-weapon").innerText = player.weapon.name;
    document.getElementById("eq-armor").innerText = player.armor.name;
    document.getElementById("sub-stats").innerText = `暴擊率: ${player.weapon.crit}% | 閃避率: ${player.armor.dodge}%`;
}

// --- 戰鬥與鍵盤控制 ---
function startBattle(x, y, type) {
    inBattle = true; canInput = true;
    enemies = [];
    const count = Math.random() < 0.5 ? 1 : (Math.random() < 0.85 ? 2 : 3);
    const groupEl = document.getElementById("enemy-group");
    groupEl.innerHTML = "";

    for (let i = 0; i < count; i++) {
        let m = monsters[type];
        let hp = m.baseHp + (player.level * 15);
        enemies.push({ ...m, maxHp: hp, hp: hp, id: i });
        groupEl.innerHTML += `
            <div class="unit-card" style="background: rgba(255,255,255,0.05); padding: 10px; border-radius: 8px; border: 1px solid #555;">
                <div style="color:${m.color}; font-size:16px; font-weight:bold; margin-bottom:5px;">${m.name} ${i+1}</div>
                <div class="hp-bar"><div id="e-hp-fill-${i}" class="hp-fill" style="width:100%"></div><div id="e-hp-label-${i}" class="hp-text">${hp}/${hp}</div></div>
            </div>`;
    }
    enemies[0].pos = {x, y};
    document.getElementById("battle-screen").style.display = "flex";
    log(`進入戰鬥！使用數字鍵 [1]攻擊 [2]藥水 [3]逃跑`);
    updateUI();
}

function playerAttack() {
    if (!inBattle || !canInput) return;
    canInput = false;
    let target = enemies.find(e => e.hp > 0);
    let isCrit = Math.random() * 100 < player.weapon.crit;
    
    if (isCrit) {
        document.getElementById("flash-effect").style.display = "block";
        setTimeout(() => document.getElementById("flash-effect").style.display = "none", 50);
        document.getElementById("game-container").classList.add("shake");
        setTimeout(() => document.getElementById("game-container").classList.remove("shake"), 200);
    }

    let dmg = Math.max(5, (player.baseAtk + player.weapon.power) - target.def) * (isCrit ? 2 : 1);
    target.hp -= dmg;
    
    document.getElementById(`e-hp-fill-${target.id}`).style.width = (Math.max(0, target.hp)/target.maxHp*100) + "%";
    document.getElementById(`e-hp-label-${target.id}`).innerText = `${Math.ceil(Math.max(0, target.hp))}/${target.maxHp}`;
    log(`⚔️ 你對 ${target.name} 造成 ${Math.ceil(dmg)} 點${isCrit?'暴擊傷害':'傷害'}！`);

    if (enemies.every(e => e.hp <= 0)) {
        inBattle = false; setTimeout(winBattle, 500);
    } else {
        setTimeout(enemyTurn, 600);
    }
}

function enemyTurn() {
    if (!inBattle) return;
    let logMsg = "";
    enemies.forEach(en => {
        if (en.hp > 0) {
            let isDodge = Math.random() * 100 < player.armor.dodge;
            if (isDodge) {
                logMsg += `💨 閃避了 ${en.name} 的攻擊！ `;
            } else {
                let dmg = Math.max(3, en.atk - (player.baseDef + player.armor.power));
                player.hp -= dmg;
                logMsg += `💥 ${en.name} 攻擊造成 ${Math.ceil(dmg)} 傷害。 `;
            }
        }
    });
    log(logMsg); updateUI();
    if (player.hp <= 0) { alert("冒險結束... 你在荒野中倒下了。"); location.reload(); }
    canInput = true;
}

function winBattle() {
    let expGained = 0; enemies.forEach(e => expGained += e.exp);
    player.exp += expGained; player.gold += (enemies.length * 25);
    map[enemies[0].pos.y][enemies[0].pos.x] = 0;
    
    if (player.exp >= 100) {
        player.level++; player.exp = 0; player.maxHp += 25; player.hp = player.maxHp;
        player.baseAtk += 4;
        const el = document.getElementById("level-up-display");
        el.style.display = "block"; setTimeout(() => el.style.display = "none", 1500);
    }

    currentLoot = [];
    if (Math.random() < 0.6) {
        let isWeapon = Math.random() > 0.5;
        currentLoot.push({
            name: isWeapon ? "神秘武器(武)" : "神秘防具(防)",
            type: isWeapon ? "weapon" : "armor",
            power: player.level * 5 + Math.floor(Math.random()*8),
            crit: isWeapon ? (5 + player.level) : 0,
            dodge: isWeapon ? 0 : (2 + player.level)
        });
    }
    if (Math.random() < 0.7) currentLoot.push({ name: "回復藥水", type: "item" });

    if (currentLoot.length === 0) closeLoot(); else showLoot();
}

// --- 商店機制 ---
function buyStat(type) {
    if (player.gold >= 150) {
        player.gold -= 150;
        if (type === 'atk') player.baseAtk += 3;
        else player.baseDef += 2;
        updateUI();
    }
}

function refreshRandomShop() {
    if (player.gold >= 50) {
        player.gold -= 50;
        const type = Math.random() > 0.5 ? "weapon" : "armor";
        const price = Math.floor(Math.random() * 200) + 250;
        randomShopItem = {
            name: type === "weapon" ? "龍鱗利劍" : "泰坦護盾",
            type: type,
            power: player.level * 7 + 12,
            price: price,
            crit: type === "weapon" ? 20 : 0,
            dodge: type === "weapon" ? 0 : 12
        };
        document.getElementById("random-item-info").innerHTML = 
            `<b>${randomShopItem.name}</b> (威力 +${randomShopItem.power}) <br> <button class="btn" style="background:#f39c12" onclick="buyRandom()">${randomShopItem.price}G 點擊購買</button>`;
        updateUI();
    }
}

function buyRandom() {
    if (randomShopItem && player.gold >= randomShopItem.price) {
        player.gold -= randomShopItem.price;
        if (randomShopItem.type === 'weapon') player.weapon = randomShopItem;
        else player.armor = randomShopItem;
        randomShopItem = null;
        document.getElementById("random-item-info").innerText = "已收購，期待下次進貨！";
        updateUI();
    }
}

// --- UI 控制 ---
function showLoot() {
    document.getElementById("battle-screen").style.display = "none";
    const screen = document.getElementById("loot-screen");
    const list = document.getElementById("loot-list");
    list.innerHTML = ""; screen.style.display = "flex";
    currentLoot.forEach((item, index) => {
        const div = document.createElement("div"); div.className = "loot-item";
        div.innerHTML = `<span>${item.name} ${item.power ? '(威力 +'+item.power+')' : ''}</span>`;
        const b = document.createElement("button"); b.className = "btn"; b.innerText = "收入背包";
        b.onclick = () => {
            if (item.type === "item") player.potions++;
            else if (item.type === "weapon") player.weapon = item;
            else if (item.type === "armor") player.armor = item;
            currentLoot.splice(index, 1);
            if (currentLoot.length === 0) closeLoot(); else showLoot();
            updateUI();
        };
        div.appendChild(b); list.appendChild(div);
    });
}

function playerHeal() {
    if (player.potions > 0 && canInput) {
        player.potions--; player.hp = Math.min(player.maxHp, player.hp + 50);
        updateUI(); if (inBattle) { canInput = false; log("喝下了藥水，傷口癒合了。"); setTimeout(enemyTurn, 600); }
    }
}

function tryEscape() {
    if (Math.random() < 0.4) { 
        document.getElementById("battle-screen").style.display = "none"; 
        inBattle = false; 
        log("驚險地逃離了戰場。");
    } else { 
        log("逃跑失敗！敵人封鎖了退路。"); 
        canInput = false; 
        setTimeout(enemyTurn, 600); 
    }
}

function closeLoot() { document.getElementById("loot-screen").style.display = "none"; inBattle = false; updateUI(); }
function closeShop() { document.getElementById("shop-screen").style.display = "none"; }
function buyPotion() { if(player.gold>=80){ player.gold-=80; player.potions++; updateUI(); } }
function sellPotion() { if(player.potions>0){ player.potions--; player.gold+=50; updateUI(); } }
function log(m) { document.getElementById("battle-log").innerText = m; }

// --- 地圖與渲染 (加大版) ---
function loadRegion(wx, wy) {
    const key = `${wx},${wy}`;
    if (worldData[key]) return worldData[key];
    let newMap = [];
    for (let y = 0; y < MAP_SIZE; y++) {
        newMap[y] = [];
        for (let x = 0; x < MAP_SIZE; x++) {
            if (x === 0 || y === 0 || x === MAP_SIZE-1 || y === MAP_SIZE-1) newMap[y][x] = (Math.abs(x-7)<=1 || Math.abs(y-7)<=1) ? 0 : 1;
            else if (wx === 0 && wy === 0 && x === 7 && y === 7) newMap[y][x] = "shop";
            else { let r = Math.random(); newMap[y][x] = r < 0.08 ? 1 : r < 0.13 ? Object.keys(monsters)[Math.floor(Math.random()*3)] : 0; }
        }
    }
    worldData[key] = newMap; return newMap;
}

function draw() {
    ctx.clearRect(0,0,900,600);
    // 置中位移計算 (Tile Size 50)
    const offsetX = 450-(player.tx*TILE_SIZE + TILE_SIZE/2), offsetY = 300-(player.ty*TILE_SIZE + TILE_SIZE/2);
    ctx.save(); ctx.translate(offsetX, offsetY);
    for (let y=0; y<MAP_SIZE; y++) {
        for (let x=0; x<MAP_SIZE; x++) {
            let t = map[y][x]; 
            ctx.fillStyle = t === "shop" ? "#f1c40f" : t === 1 ? "#333" : t === 0 ? "#111" : monsters[t].color;
            ctx.fillRect(x*TILE_SIZE, y*TILE_SIZE, TILE_SIZE-2, TILE_SIZE-2);
        }
    }
    // 玩家
    ctx.fillStyle = "#00ffcc"; ctx.fillRect(player.tx*TILE_SIZE+8, player.ty*TILE_SIZE+8, TILE_SIZE-16, TILE_SIZE-16);
    ctx.restore(); requestAnimationFrame(draw);
}

// --- 鍵盤控制核心 ---
window.addEventListener("keydown", e => {
    if (inBattle) {
        if (canInput) {
            if (e.key === "1") playerAttack();
            else if (e.key === "2") playerHeal();
            else if (e.key === "3") tryEscape();
        }
        return;
    }
    if (document.getElementById("shop-screen").style.display === "flex" || document.getElementById("loot-screen").style.display === "flex") return;
    
    let nx = player.tx, ny = player.ty;
    if (e.key === "ArrowUp") ny--; else if (e.key === "ArrowDown") ny++; else if (e.key === "ArrowLeft") nx--; else if (e.key === "ArrowRight") nx++;
    
    if (nx < 0) switchRegion(-1, 0); else if (nx >= MAP_SIZE) switchRegion(1, 0); else if (ny < 0) switchRegion(0, -1); else if (ny >= MAP_SIZE) switchRegion(0, 1);
    else if (map[ny][nx] !== 1) { 
        player.tx = nx; player.ty = ny; 
        if (map[ny][nx] === "shop") document.getElementById("shop-screen").style.display = "flex";
        else if (typeof map[ny][nx] === "string") startBattle(nx, ny, map[ny][nx]); 
    }
    updateUI();
});

function switchRegion(dx, dy) {
    currentWorldX += dx; currentWorldY += dy; map = loadRegion(currentWorldX, currentWorldY);
    if (dx === 1) player.tx = 0; else if (dx === -1) player.tx = MAP_SIZE-1;
    else if (dy === 1) player.ty = 0; else if (dy === -1) player.ty = MAP_SIZE-1;
    updateUI();
}

map = loadRegion(0, 0); updateUI(); draw();
</script>
</body>
</html>
