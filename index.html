<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>永恆荒野 RPG - 冒險重生</title>
    <style>
        body { background: #1a1a1a; color: white; display: flex; flex-direction: column; align-items: center; font-family: "Microsoft JhengHei", sans-serif; margin: 0; overflow: hidden; }
        #game-container { position: relative; width: 900px; height: 600px; margin-top: 10px; border: 4px solid #444; }
        canvas { background: #000; display: block; }
        
        /* UI 標籤 */
        #coord-tag { position: absolute; top: 15px; left: 15px; background: rgba(0,0,0,0.8); padding: 8px 15px; border-radius: 20px; border: 1px solid #0fccff; color: #0fccff; font-size: 14px; font-weight: bold; z-index: 50; }
        #flash-effect { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 1000; pointer-events: none; opacity: 0.5; }
        
        /* 戰鬥與商店介面 */
        .overlay { display: none; position: absolute; top: 0; left: 0; width: 900px; height: 600px; background: rgba(0,0,0,0.9); flex-direction: column; align-items: center; z-index: 100; padding-top: 30px; box-sizing: border-box; }
        #battle-screen { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 85%; height: 85%; background: rgba(10, 10, 10, 0.98); border: 3px solid #e74c3c; border-radius: 15px; flex-direction: column; align-items: center; justify-content: center; z-index: 110; padding: 20px; }
        
        .hp-bar { width: 100%; height: 20px; background: #400; border: 1px solid #fff; position: relative; border-radius: 5px; overflow: hidden; }
        .hp-fill { height: 100%; background: #2ecc71; transition: width 0.3s; width: 100%; }
        .hp-text { position: absolute; width: 100%; text-align: center; font-size: 12px; line-height: 20px; color: white; top: 0; font-weight: bold; }
        
        .btn { padding: 10px 20px; background: #333; color: white; border: 1px solid #fff; cursor: pointer; font-size: 14px; border-radius: 6px; margin: 5px; }
        .btn:hover { background: #555; border-color: #0fccff; }
        .tp-btn { background: #8e44ad !important; border-color: #d291ff !important; }
        
        #ui { width: 880px; background: #222; padding: 15px; margin-top: 10px; border-radius: 10px; display: grid; grid-template-columns: 1fr 1fr; border: 2px solid #444; }
        .diff-pos { color: #2ecc71; font-weight: bold; }
        .diff-neg { color: #e74c3c; font-weight: bold; }
    </style>
</head>
<body>

<div id="flash-effect"></div>
<div id="game-container">
    <div id="coord-tag">🗺️ 座標: [<span id="pos-display">0, 0</span>] <span id="danger-lvl" style="color:#e74c3c; margin-left:10px;"></span></div>
    <canvas id="gameCanvas" width="900" height="600"></canvas>

    <div id="battle-screen">
        <h2 style="color: #e74c3c; margin-bottom: 10px;">BATTLE</h2>
        <div id="enemy-group" style="display:flex; gap:20px; margin-bottom:20px;"></div>
        <div style="width:300px; background: rgba(15, 202, 255, 0.1); padding: 10px; border-radius: 10px; border: 1px solid #0fccff; margin-bottom: 15px;">
            <div style="color:#0fccff; font-weight:bold;">勇者 HP</div>
            <div class="hp-bar"><div id="p-hp-fill" class="hp-fill"></div><div id="p-hp-label" class="hp-text"></div></div>
        </div>
        <div id="battle-log" style="font-size:16px; color:#eee; min-height:50px; text-align:center; width: 90%; background: rgba(255,255,255,0.05); padding: 10px; border-radius: 8px;">準備戰鬥...</div>
        <div class="actions">
            <button class="btn" onclick="playerAttack()">[1] 攻擊</button>
            <button class="btn" onclick="playerHeal()">[2] 藥水</button>
            <button class="btn tp-btn" onclick="useTeleport()">[T] 傳送石</button>
            <button class="btn" onclick="tryEscape()">[3] 逃跑</button>
        </div>
    </div>

    <div id="shop-screen" class="overlay">
        <h1 style="color: #f1c40f;">村莊商店</h1>
        <p>持有金幣: <span id="shop-gold">0</span> G</p>
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:15px; width:80%;">
            <div style="background:#333; padding:15px; border-radius:8px;">
                <b style="color:#f1c40f">🎲 隨機裝備 (50G)</b><br>
                <button class="btn" style="width:100%" onclick="refreshRandomShop()">刷新貨架</button>
                <div id="random-item-info" style="margin-top:10px; font-size:14px; background:#111; padding:8px;"></div>
            </div>
            <div style="background:#333; padding:15px; border-radius:8px;">
                <b style="color:#2ecc71">🧪 補給品</b><br>
                <button class="btn" style="width:100%" onclick="buyPotion()">補血藥水 (80G)</button>
                <button class="btn tp-btn" style="width:100%" onclick="buyTeleport()">傳送石 (150G)</button>
            </div>
        </div>
        <button class="btn" style="margin-top:20px; width:200px;" onclick="closeShop()">離開</button>
    </div>

    <div id="loot-screen" class="overlay">
        <h2 style="color: #f1c40f;">獲得戰利品</h2>
        <div id="loot-list"></div>
        <button class="btn" onclick="closeLoot()">繼續</button>
    </div>
</div>

<div id="ui">
    <div>
        <div style="color:#0fccff; font-size: 20px; font-weight: bold;">Lv. <span id="lvl">1</span> | EXP: <span id="exp">0</span>/100</div>
        <div>💰 金幣: <span id="gold-ui">0</span> | 🧪 藥水: <span id="ui-pot-count">0</span> | 🔮 傳送石: <span id="ui-tp-count">0</span></div>
    </div>
    <div style="text-align: right;">
        <div style="color:#f1c40f; font-weight:bold;">⚔️ <span id="eq-weapon">木棒</span> | 🛡️ <span id="eq-armor">布衣</span></div>
        <div style="font-size:12px; color:#aaa;">
            ATK: <span id="atk-total">0</span> (爆擊 <span id="ui-crit">0</span>%) | 
            DEF: <span id="def-total">0</span> (閃避 <span id="ui-dodge">0</span>%)
        </div>
    </div>
</div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
const MAP_SIZE = 15, TILE_SIZE = 50;

let worldData = {}, currentWorldX = 0, currentWorldY = 0, map = [];
let inBattle = false, enemies = [], currentLoot = [], canInput = true, randomShopItem = null;

const player = {
    tx: 7, ty: 7, hp: 100, maxHp: 100, level: 1, exp: 0, gold: 100,
    baseAtk: 15, baseDef: 5, potions: 3, teleportStones: 1,
    weapon: { name: "木棒", power: 2, crit: 5 },
    armor: { name: "布衣", power: 1, dodge: 2 }
};

const monsters = {
    "slime": { name: "史萊姆", baseHp: 35, atk: 8, def: 2, color: "#9b59b6", exp: 20, skill: "黏液噴射" },
    "goblin": { name: "哥布林", baseHp: 65, atk: 16, def: 5, color: "#2ecc71", exp: 45, skill: "瘋狂亂抓" },
    "orc": { name: "獸人", baseHp: 160, atk: 28, def: 12, color: "#e67e22", exp: 90, skill: "大地粉碎" },
    "stalker": { name: "荒野獵殺者", baseHp: 220, atk: 45, def: 15, color: "#e74c3c", exp: 150, skill: "暗影襲擊" }
};

function updateUI() {
    const dist = Math.abs(currentWorldX) + Math.abs(currentWorldY);
    document.getElementById("pos-display").innerText = `${currentWorldX}, ${currentWorldY}`;
    document.getElementById("danger-lvl").innerText = dist > 0 ? `危險度: ${dist}` : `村莊`;
    document.getElementById("lvl").innerText = player.level;
    document.getElementById("exp").innerText = player.exp;
    document.getElementById("gold-ui").innerText = player.gold;
    document.getElementById("shop-gold").innerText = player.gold;
    document.getElementById("ui-pot-count").innerText = player.potions;
    document.getElementById("ui-tp-count").innerText = player.teleportStones;
    
    document.getElementById("p-hp-fill").style.width = (player.hp / player.maxHp * 100) + "%";
    document.getElementById("p-hp-label").innerText = `${Math.ceil(player.hp)}/${player.maxHp}`;
    document.getElementById("eq-weapon").innerText = player.weapon.name;
    document.getElementById("eq-armor").innerText = player.armor.name;
    document.getElementById("atk-total").innerText = player.baseAtk + player.weapon.power;
    document.getElementById("def-total").innerText = player.baseDef + player.armor.power;
    document.getElementById("ui-crit").innerText = player.weapon.crit;
    document.getElementById("ui-dodge").innerText = player.armor.dodge;
}

// --- 死亡重生 ---
function handlePlayerDeath() {
    canInput = false;
    log("💀 你戰敗了！村民將你救回村莊...");
    setTimeout(() => {
        inBattle = false;
        document.getElementById("battle-screen").style.display = "none";
        currentWorldX = 0; currentWorldY = 0;
        map = loadRegion(0, 0);
        player.tx = 7; player.ty = 7;
        player.hp = player.maxHp * 0.5; // 恢復 50% HP，裝備保留
        
        const flash = document.getElementById("flash-effect");
        flash.style.background = "red";
        flash.style.display = "block";
        setTimeout(() => { flash.style.display = "none"; flash.style.background = "white"; }, 300);
        
        canInput = true; updateUI();
        log("你在村莊醒來，幸好裝備都在。");
    }, 1500);
}

// --- 爆擊與攻擊邏輯 ---
function playerAttack() {
    if (!inBattle || !canInput) return;
    let target = enemies.find(e => e.hp > 0); if (!target) return;
    canInput = false;
    
    // 爆擊判定與特效
    let isCrit = Math.random() * 100 < player.weapon.crit;
    if (isCrit) {
        const flash = document.getElementById("flash-effect");
        flash.style.display = "block";
        setTimeout(() => flash.style.display = "none", 50);
    }
    
    let dmg = Math.max(5, (player.baseAtk + player.weapon.power) - target.def) * (isCrit ? 2 : 1);
    target.hp -= dmg;
    
    document.getElementById(`e-hp-fill-${target.id}`).style.width = (Math.max(0, target.hp)/target.maxHp*100) + "%";
    document.getElementById(`e-hp-label-${target.id}`).innerText = `${Math.ceil(Math.max(0, target.hp))}/${target.maxHp}`;
    
    log(`${isCrit ? '🔥 爆擊！' : '⚔️'} 造成 ${Math.ceil(dmg)} 傷害`);
    if (enemies.every(e => e.hp <= 0)) { setTimeout(winBattle, 500); } else { setTimeout(enemyTurn, 600); }
}

function enemyTurn() {
    if (!inBattle) return;
    let logMsg = "";
    enemies.forEach(en => {
        if (en.hp > 0) {
            // 閃避判定
            if (Math.random() * 100 < player.armor.dodge) logMsg += `💨 閃避！ `;
            else {
                let dmg;
                if (Math.random() < 0.5) { // 50% 技能機率
                    dmg = Math.max(10, (en.atk * 1.5) - (player.baseDef + player.armor.power));
                    logMsg += `✨ ${en.name}：${en.skill}！ `;
                } else {
                    dmg = Math.max(3, en.atk - (player.baseDef + player.armor.power));
                    logMsg += `💥 ${en.name} 攻擊。 `;
                }
                player.hp -= dmg;
            }
        }
    });
    log(logMsg); updateUI();
    if (player.hp <= 0) handlePlayerDeath(); else canInput = true;
}

// --- 商店與裝備比較 ---
function refreshRandomShop() {
    if (player.gold >= 50) {
        player.gold -= 50;
        const type = Math.random() > 0.5 ? "weapon" : "armor";
        const power = (player.level + Math.abs(currentWorldX)) * 8 + Math.floor(Math.random() * 15);
        const sub = 10 + Math.floor(Math.random() * 10);
        const price = 200 + Math.floor(Math.random() * 100);
        
        randomShopItem = { 
            name: type === "weapon" ? "鋼鐵大劍" : "騎士鎧甲", 
            type, power, price, 
            crit: type === "weapon" ? sub : 0, 
            dodge: type === "weapon" ? 0 : sub 
        };
        
        const curPower = type === "weapon" ? player.weapon.power : player.armor.power;
        const diff = power - curPower;
        
        document.getElementById("random-item-info").innerHTML = `
            威力: ${power} (<span class="${diff>=0?'diff-pos':'diff-neg'}">${diff>=0?'+':''}${diff}</span>)<br>
            副屬性: ${type==="weapon"?"爆擊":"閃避"} +${sub}%<br>
            價格: ${price} G <button class="btn" style="width:100%" onclick="buyRandom()">購買</button>
        `;
        updateUI();
    }
}

function buyRandom() {
    if (randomShopItem && player.gold >= randomShopItem.price) {
        player.gold -= randomShopItem.price;
        if (randomShopItem.type === "weapon") player.weapon = randomShopItem;
        else player.armor = randomShopItem;
        randomShopItem = null;
        document.getElementById("random-item-info").innerHTML = "已裝備";
        updateUI();
    }
}

// --- 其他功能 ---
function buyPotion() { if(player.gold>=80){ player.gold-=80; player.potions++; updateUI(); } }
function buyTeleport() { if(player.gold>=150){ player.gold-=150; player.teleportStones++; updateUI(); } }
function playerHeal() { if (player.potions > 0 && canInput) { player.potions--; player.hp = Math.min(player.maxHp, player.hp + 50); updateUI(); if (inBattle) { canInput = false; setTimeout(enemyTurn, 600); } } }
function tryEscape() { if (Math.random() < 0.4) { document.getElementById("battle-screen").style.display = "none"; inBattle = false; } else { log("逃跑失敗！"); canInput = false; setTimeout(enemyTurn, 600); } }
function useTeleport() { if (player.teleportStones > 0) { player.teleportStones--; inBattle = false; document.getElementById("battle-screen").style.display = "none"; currentWorldX = 0; currentWorldY = 0; map = loadRegion(0,0); player.tx = 7; player.ty = 7; updateUI(); log("使用傳送石回村。"); } }
function log(m) { document.getElementById("battle-log").innerText = m; }
function closeShop() { document.getElementById("shop-screen").style.display = "none"; }
function closeLoot() { document.getElementById("loot-screen").style.display = "none"; inBattle = false; updateUI(); }

// --- 地圖與生成 ---
function loadRegion(wx, wy) {
    const key = `${wx},${wy}`; if (worldData[key]) return worldData[key];
    let newMap = []; const dist = Math.abs(wx) + Math.abs(wy);
    for (let y = 0; y < MAP_SIZE; y++) {
        newMap[y] = [];
        for (let x = 0; x < MAP_SIZE; x++) {
            if (x === 0 || y === 0 || x === MAP_SIZE-1 || y === MAP_SIZE-1) newMap[y][x] = (Math.abs(x-7)<=1 || Math.abs(y-7)<=1) ? 0 : 1;
            else if (wx === 0 && wy === 0 && x === 7 && y === 7) newMap[y][x] = "shop";
            else {
                let r = Math.random();
                if (r < 0.1) {
                    let pool = ["slime", "goblin", "orc"];
                    if (dist >= 3) pool.push("stalker");
                    newMap[y][x] = pool[Math.floor(Math.random() * pool.length)];
                } else newMap[y][x] = 0;
            }
        }
    }
    worldData[key] = newMap; return newMap;
}

function startBattle(x, y, type) {
    inBattle = true; canInput = true; enemies = [];
    const dist = Math.abs(currentWorldX) + Math.abs(currentWorldY);
    const mult = 1 + (dist * 0.2);
    const count = Math.random() < 0.7 ? 1 : 2;
    const groupEl = document.getElementById("enemy-group"); groupEl.innerHTML = "";
    for (let i = 0; i < count; i++) {
        let m = monsters[type]; let hp = Math.floor((m.baseHp + (player.level * 10)) * mult);
        enemies.push({ ...m, maxHp: hp, hp: hp, atk: Math.floor(m.atk * mult), def: Math.floor(m.def * mult), exp: Math.floor(m.exp * mult), id: i });
        groupEl.innerHTML += `<div style="background:#333; padding:8px; border-radius:8px; width:140px; border: 1px solid #555;"><div style="color:${m.color}; font-size:12px; font-weight:bold;">${m.name}</div><div class="hp-bar"><div id="e-hp-fill-${i}" class="hp-fill"></div><div id="e-hp-label-${i}" class="hp-text">${hp}/${hp}</div></div></div>`;
    }
    enemies[0].pos = {x, y}; document.getElementById("battle-screen").style.display = "flex"; log(`遭遇敵人！`); updateUI();
}

function winBattle() {
    let expGained = 0; enemies.forEach(e => expGained += e.exp);
    player.exp += expGained; player.gold += (enemies.length * 50);
    map[enemies[0].pos.y][enemies[0].pos.x] = 0;
    if (player.exp >= 100) { player.level++; player.exp = 0; player.maxHp += 20; player.hp = player.maxHp; player.baseAtk += 5; }
    currentLoot = [];
    if (Math.random() < 0.6) currentLoot.push({ name: "藥水", type: "item" });
    if (enemies.some(e => e.name === "荒野獵殺者") && Math.random() < 0.4) currentLoot.push({ name: "傳送石", type: "tp" });
    showLoot();
}

function showLoot() {
    document.getElementById("battle-screen").style.display = "none";
    const screen = document.getElementById("loot-screen"); const list = document.getElementById("loot-list");
    list.innerHTML = ""; screen.style.display = "flex";
    currentLoot.forEach((item, index) => {
        const b = document.createElement("button"); b.className = "btn"; b.innerText = `拾取 ${item.name}`;
        b.onclick = () => { if(item.type === "tp") player.teleportStones++; else player.potions++; currentLoot.splice(index, 1); if(currentLoot.length === 0) closeLoot(); else showLoot(); };
        list.appendChild(b);
    });
    if(currentLoot.length === 0) closeLoot();
}

function draw() {
    ctx.clearRect(0,0,900,600);
    const offsetX = 450-(player.tx*TILE_SIZE + TILE_SIZE/2), offsetY = 300-(player.ty*TILE_SIZE + TILE_SIZE/2);
    ctx.save(); ctx.translate(offsetX, offsetY);
    for (let y=0; y<MAP_SIZE; y++) {
        for (let x=0; x<MAP_SIZE; x++) {
            let t = map[y][x]; 
            ctx.fillStyle = t === "shop" ? "#f1c40f" : t === 1 ? "#333" : t === 0 ? "#111" : monsters[t].color;
            ctx.fillRect(x*TILE_SIZE, y*TILE_SIZE, TILE_SIZE-2, TILE_SIZE-2);
        }
    }
    ctx.fillStyle = "#00ffcc"; ctx.fillRect(player.tx*TILE_SIZE+10, player.ty*TILE_SIZE+10, TILE_SIZE-20, TILE_SIZE-20);
    ctx.restore(); requestAnimationFrame(draw);
}

window.addEventListener("keydown", e => {
    if (inBattle && canInput) {
        if (e.key === "1") playerAttack(); else if (e.key === "2") playerHeal(); else if (e.key === "3") tryEscape(); else if (e.key.toLowerCase() === "t") useTeleport();
        return;
    }
    if (document.getElementById("shop-screen").style.display === "flex") return;
    let nx = player.tx, ny = player.ty;
    if (e.key === "ArrowUp") ny--; else if (e.key === "ArrowDown") ny++; else if (e.key === "ArrowLeft") nx--; else if (e.key === "ArrowRight") nx++;
    if (nx < 0) { currentWorldX--; map = loadRegion(currentWorldX, currentWorldY); player.tx = MAP_SIZE-1; }
    else if (nx >= MAP_SIZE) { currentWorldX++; map = loadRegion(currentWorldX, currentWorldY); player.tx = 0; }
    else if (ny < 0) { currentWorldY--; map = loadRegion(currentWorldX, currentWorldY); player.ty = MAP_SIZE-1; }
    else if (ny >= MAP_SIZE) { currentWorldY++; map = loadRegion(currentWorldX, currentWorldY); player.ty = 0; }
    else if (map[ny][nx] !== 1) { 
        player.tx = nx; player.ty = ny; 
        if (map[ny][nx] === "shop") { document.getElementById("shop-screen").style.display = "flex"; updateUI(); }
        else if (typeof map[ny][nx] === "string") startBattle(nx, ny, map[ny][nx]); 
    }
    updateUI();
});
map = loadRegion(0, 0); updateUI(); draw();
</script>
</body>
</html>
